<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fasco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <a class="logo" href="">FASCO</a>
        <nav class="nav-links">
          <a href="">Home</a><a href="">Deals</a><a href="">New Arrivals</a
          ><a href="">Packages</a><a href="">Sign in</a>
          <button class="nav-btn">Sign up</button>
        </nav>
      </div>
    </header>
    <section class="hero-sale">
      <div class="side-sale">
        <img src="./img/left (2).png" alt="" />
      </div>
      <div class="center-sale">
        <img class="center-img-top" src="./img/center-top.png" alt="" />
        <div class="center-texts">
          <p class="center-text-one">ULTIMATE</p>
          <p class="center-text-two">SALE</p>
          <p class="center-text-three">NEW COLLECTION</p>
          <button class="sale-btn">SHOP NOW</button>
        </div>
        <img class="center-img-bottom" src="./img/center-bottom.png" alt="" />
      </div>
      <div class="side-sale">
        <img class="right-side-hero-img" src="./img/right.png" alt="" />
      </div>
    </section>
    <section class="ft-companis-main">
      <img src="./img/logo.png" alt="" />
      <img src="./img/logo(1).png" alt="" />
      <img src="./img/logo(2).png" alt="" /><img
        src="./img/logo(3).png"
        alt=""
      /><img src="./img/logo(4).png" alt="" />
    </section>
  </body>
  <script src="script.js"></script>
</html>
