            name=""
            id=""
          />
          <div class="half-inputs">

              type="text"
            />

          <input

           <div class="half-inputs">

                type="text"
              />
            </div>
            
           </div>

          <input
            placeholder="Credit Card"
            class="account-query-input"
            type="text"
            name=""
            id=""
          />
           <input
            placeholder="Credit Card Number"
            class="account-query-input"
            type="text"
            name=""
            id=""
          />

            />
          </div>
          <input
            placeholder="Email Adresss"

            type="text"
            name=""
            id=""
          />

              <input placeholder="Ctiy" type="text" /><input
                placeholder="Postal Code"
                type="text"
              />
            </div>
            <button class="pay-btn">Pay Now</button>
           </div>
           
        </div>
        
        <div class="demo-right">...</div>
