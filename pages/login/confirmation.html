<html lang="en">

  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&display=swap"
          rel="stylesheet"
        />
        <link
          href="https://fonts.cdnfonts.com/css/digital-7-mono"
          rel="stylesheet"
        />
      </head>
      <body>
        <div class="login-card">
          <div class="wrapper-login">
            <div class="left-side-login-card">
              <img src="/img/login-page-female-img.png" alt="" />
            </div>
            <div class="right-side-login-card">
              <p class="login-logo">FASCO</p>
              <p class="login-para">Forgot Password</p>
              <div class="login-inputs-forgot">
                <div class="prev-inputs">
                  <input
                    class="input-fields-login"
                    placeholder="Email"
                    type="text"
                  />
                  <input
                    class="input-fields-login"
                    placeholder="Password"
                    type="text"
                  />
                </div>
                <div class="forgot-inputs">
                  <input
                    class="input-fields-login"
                    placeholder="Email"
                    type="text"
                  />
                  <input
                    class="input-fields-login"
                    placeholder="Password"
                    type="text"
                  />
                </div>
              </div>
              <div class="main-login-btns">
                <button class="btn-confirmation-btn"><a href="/pages/login/forgot.html"">Send Confirmation Code</a></button>
              </div>
              <p class="forgot-textline">
                Already have an account?<span class="login-forgot">Login</span>
              </p>
            </div>
          </div>
        </div>
      </body>
    </html>
  </body>
</html>
