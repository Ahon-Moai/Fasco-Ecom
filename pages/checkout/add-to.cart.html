<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Volkhov:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.cdnfonts.com/css/digital-7-mono"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="shop-navbar">
      <a class="logo" href="">FASCO</a>
      <div class="shop-nav-items">
        <p>Home</p>
        <p class="active-nav">Shop</p>
        <p>Products</p>
        <p>Pages</p>

        <!--Add Page Down Icon-->
      </div>
      <div class="nav-shop-icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-user-astronaut"></i>
        <i class="fa-regular fa-star"></i>
        <i class="fa-solid fa-shop"></i>
      </div>
    </div>
    <div class="fashion-main-text">
      <h1 class="fashion-main-text-head">Shopping Cart</h1>
      <p class="fashion-text-para">
        Home<span class="fashion-main-text-span">></span>Shopping Cart
      </p>
    </div>

    <section class="main-checkout">
      <div class="checkout-head-line">
        <div class="product-div">
          <p>Product</p>
        </div>

        <p>Price</p>
        <p>Quantity</p>
        <p>Total</p>
      </div>
      <div class="product-checkout-main">
        <div class="product-showcase-checkout">
          <img src="/img/sell-product-one.png" alt="" />
          <div class="product-showcase-text">
            <p class="dress-name">Mini dress with ruffled straps</p>
            <p class="dress-color">Color : Red</p>
            <p class="dress-remove">Remove</p>
          </div>
        </div>

        <p>$14.90</p>

        <div class="dress-quantity">
          <div class="quantity-div">
            <button class="quantity-btns">-</button>
            <button class="quantity-btns">1</button>
            <button class="quantity-btns">+</button>
          </div>
        </div>
        <p>$2500</p>
      </div>
    </section>
    <section class="price-checkout">
      <div class="right-going">
        <div class="checkbox">
          <input type="checkbox" name="" id="" />
          <p>For <span>$10.00</span> please wrap the product</p>
        </div>
        <div class="subtotal">
          <p>Subtotal</p>
          <p>$100</p>
        </div>
        <div class="checkout-btn">
          <a href="/pages/shop/product-demo-checkout.html" target="_blank">
            <button class="checkout-btn-real">Checkout</button
            ><button class="view-cart">View Cart</button>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
